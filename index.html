<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>長久寺 檀信徒認証</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #status {
      margin-top: 25px;
      line-height: 1.8;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>長久寺 檀信徒認証</h1>

    <p>LINEアカウントを確認しています。</p>

    <div id="status">
      LIFFを初期化しています…
    </div>

  </div>


<script>

const LIFF_ID = "2011649394-wJceQFXt";

async function startLiff() {

  const status =
    document.getElementById("status");

  try {

    await liff.init({
      liffId: LIFF_ID,
      withLoginOnExternalBrowser: true
    });

    if (!liff.isLoggedIn()) {
      status.textContent =
        "LINEへログインします…";

      liff.login();
      return;
    }

    const profile =
      await liff.getProfile();

    status.className = "success";

    status.innerHTML =
      "LIFFの起動に成功しました。<br><br>" +
      profile.displayName +
      " さん<br>" +
      "LINEアカウントを確認できました。";

  }

  catch (error) {

    console.error(error);

    status.className = "error";

    status.textContent =
      "LIFFの初期化に失敗しました：" +
      error.message;

  }

}

startLiff();

</script>

</body>
</html>
