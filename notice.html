<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>お知らせ｜長久寺 檀信徒専用ページ</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101010;
      color: #eeeeee;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 42px 30px 80px;
    }

    .temple-name {
      color: #999999;
      font-size: 14px;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
    }

    .line {
      height: 1px;
      background: #383838;
      margin: 32px 0;
    }

    #loading {
      padding: 30px 0;
      color: #aaaaaa;
      font-size: 15px;
      line-height: 1.8;
    }

    #error {
      display: none;

      background: #1b1b1b;
      border: 1px solid #383838;
      border-radius: 14px;

      padding: 25px 20px;

      color: #ef9a9a;
      line-height: 1.8;
      text-align: center;
    }

    #content {
      display: none;
    }

    .welcome {
      color: #aaaaaa;
      font-size: 14px;
      margin-bottom: 34px;
    }

    .notice-section {
      margin-bottom: 42px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 16px;

      font-size: 19px;
      font-weight: 700;
    }

    .section-icon {
      font-size: 21px;
    }

    .section-description {
      color: #888888;
      font-size: 13px;
      line-height: 1.7;

      margin-top: -7px;
      margin-bottom: 18px;
    }

    #personalSection {
      display: none;
    }

    .notice-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .notice-card {
      overflow: hidden;

      background: #1b1b1b;
      border: 1px solid #383838;
      border-radius: 16px;
    }

    .notice-card.personal {
      background: #202020;
      border-color: #555555;
    }

    /*
     * 画像読み込み中
     */
    .image-loading {
      padding: 30px 20px;

      background: #171717;
      color: #777777;

      font-size: 13px;
      text-align: center;
    }

    /*
     * お知らせ画像
     */
    .notice-image {
      display: block;

      width: 100%;
      max-height: 440px;

      object-fit: cover;

      background: #181818;
    }

    .notice-content {
      padding: 22px 20px;
    }

    .personal-label {
      display: inline-block;

      margin-bottom: 12px;
      padding: 5px 9px;

      background: #333333;
      border-radius: 6px;

      color: #dddddd;

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .notice-date {
      color: #888888;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .notice-title {
      color: #eeeeee;

      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;

      margin-bottom: 10px;
    }

    .notice-body {
      color: #bbbbbb;

      font-size: 15px;
      line-height: 1.85;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .notice-link {
      display: flex;

      width: 100%;

      align-items: center;
      justify-content: space-between;

      margin-top: 20px;
      padding: 14px 16px;

      background: #292929;
      border: 1px solid #444444;
      border-radius: 10px;

      color: #eeeeee;

      text-decoration: none;

      font-size: 14px;
      font-weight: 600;
    }

    .notice-link:hover {
      background: #333333;
      border-color: #666666;
    }

    .notice-link::after {
      content: "→";
      color: #aaaaaa;
      font-size: 17px;
    }

    .empty {
      background: #1b1b1b;
      border: 1px solid #383838;
      border-radius: 14px;

      padding: 28px 20px;

      color: #888888;

      text-align: center;
      line-height: 1.8;
    }

    .back {
      display: inline-block;

      margin-top: 12px;

      color: #bbbbbb;

      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #ffffff;
    }

    .privacy-note {
      margin-top: 36px;

      padding: 16px 17px;

      background: #171717;
      border-left: 3px solid #555555;

      color: #888888;

      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {

      .page {
        padding:
          34px 20px
          calc(60px + env(safe-area-inset-bottom));
      }

      h1 {
        font-size: 27px;
      }

      .notice-content {
        padding: 20px 18px;
      }

      .notice-image {
        max-height: 320px;
      }

      .section-heading {
        font-size: 18px;
      }

    }

  </style>
</head>


<body>

<main class="page">

  <div class="temple-name">
    曹洞宗 春日山 長久寺
  </div>

  <h1>
    お知らせ
  </h1>

  <div class="line"></div>


  <div id="loading">
    お知らせを確認しています…
  </div>


  <div id="error"></div>


  <div id="content">

    <div
      id="welcome"
      class="welcome">
    </div>


    <!-- 個別案内 -->
    <section
      id="personalSection"
      class="notice-section">

      <div class="section-heading">

        <span class="section-icon">
          ✉️
        </span>

        <span>
          あなたへのご案内
        </span>

      </div>

      <div class="section-description">
        長久寺から個別にお送りしているご案内です。
      </div>

      <div
        id="personalNoticeList"
        class="notice-list">
      </div>

    </section>


    <!-- 全体のお知らせ -->
    <section class="notice-section">

      <div class="section-heading">

        <span class="section-icon">
          📢
        </span>

        <span>
          長久寺からのお知らせ
        </span>

      </div>

      <div class="section-description">
        檀信徒の皆様へのお知らせです。
      </div>

      <div
        id="generalNoticeList"
        class="notice-list">
      </div>

    </section>


    <a
      class="back"
      href="./">
      ← 檀信徒専用ページへ戻る
    </a>


    <div class="privacy-note">
      「あなたへのご案内」には、
      個別のご連絡が表示される場合があります。
      内容を第三者へ共有しないようお願いいたします。
    </div>

  </div>

</main>


<script>

/*
 * LINE MINI App
 */
const LIFF_ID =
  "2011649394-wJceQFXt";


/*
 * Apps Script
 *
 * 今まで使っている /exec URL
 */
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyTU8HcWkrg8glnRa1gL0UknRJEup7yLEIEycTYCSjcts32tzXa3KclmV_scM603bqgoA/exec";


let currentIdToken =
  "";


/*
 * GASへ認証付きPOST
 */
async function callApi(data) {

  const response =
    await fetch(
      GAS_URL,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data),

        redirect:
          "follow"
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );
  }


  return await response.json();
}


/*
 * 安全なテキスト要素
 */
function createTextElement(
  tagName,
  className,
  text
) {

  const element =
    document.createElement(
      tagName
    );


  element.className =
    className;


  element.textContent =
    text || "";


  return element;
}


/*
 * http / https URL確認
 */
function isSafeHttpUrl(
  value
) {

  if (
    typeof value !==
    "string"
  ) {
    return false;
  }


  try {

    const url =
      new URL(value);


    return (
      url.protocol ===
        "https:" ||
      url.protocol ===
        "http:"
    );


  } catch (_) {

    return false;
  }
}


/*
 * 非公開Drive画像を取得
 */
async function loadPrivateImage(
  fileId,
  imageContainer
) {

  try {

    const result =
      await callApi({

        action:
          "noticeImage",

        idToken:
          currentIdToken,

        fileId:
          fileId

      });


    if (
      !result ||
      !result.success ||
      !result.data ||
      !result.mimeType
    ) {

      /*
       * 取得できなかった場合は
       * 画像欄自体を消す
       */
      imageContainer.remove();

      return;
    }


    /*
     * Base64 → Blob
     *
     * data: URLとして直接srcへ入れるより
     * Blob URLに変換する。
     */
    const binary =
      atob(
        result.data
      );


    const bytes =
      new Uint8Array(
        binary.length
      );


    for (
      let i = 0;
      i < binary.length;
      i++
    ) {

      bytes[i] =
        binary.charCodeAt(i);

    }


    const blob =
      new Blob(
        [bytes],
        {
          type:
            result.mimeType
        }
      );


    const objectUrl =
      URL.createObjectURL(
        blob
      );


    const image =
      document.createElement(
        "img"
      );


    image.className =
      "notice-image";


    image.alt =
      "お知らせ画像";


    image.loading =
      "lazy";


    image.onload =
      function() {

        /*
         * 表示完了後もURLは
         * imgが使用しているので
         * ページ終了時まで保持する。
         */

      };


    image.onerror =
      function() {

        URL.revokeObjectURL(
          objectUrl
        );

        imageContainer.remove();

      };


    image.src =
      objectUrl;


    imageContainer
      .replaceChildren(
        image
      );


  } catch (error) {

    console.error(
      "画像取得エラー",
      error
    );


    imageContainer.remove();

  }
}


/*
 * お知らせカード作成
 */
function createNoticeCard(
  notice,
  personal
) {

  const card =
    document.createElement(
      "article"
    );


  card.className =
    personal
      ? "notice-card personal"
      : "notice-card";


  /*
   * 新方式：
   * 非公開Drive画像
   */
  if (
    notice.imageFileId
  ) {

    const imageContainer =
      document.createElement(
        "div"
      );


    imageContainer.className =
      "image-loading";


    imageContainer.textContent =
      "画像を読み込んでいます…";


    card.appendChild(
      imageContainer
    );


    /*
     * カードを先に生成して
     * 画像は非同期取得
     */
    loadPrivateImage(
      notice.imageFileId,
      imageContainer
    );

  }

  /*
   * 旧方式：
   * 公開画像URL
   */
  else if (
    notice.imageUrl &&
    isSafeHttpUrl(
      notice.imageUrl
    )
  ) {

    const image =
      document.createElement(
        "img"
      );


    image.className =
      "notice-image";


    image.src =
      notice.imageUrl;


    image.alt =
      notice.title ||
      "お知らせ画像";


    image.loading =
      "lazy";


    image.addEventListener(
      "error",
      function() {

        image.remove();

      }
    );


    card.appendChild(
      image
    );
  }


  /*
   * 本文エリア
   */
  const content =
    document.createElement(
      "div"
    );


  content.className =
    "notice-content";


  /*
   * 個別案内ラベル
   */
  if (personal) {

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "personal-label";


    label.textContent =
      "個別のご案内";


    content.appendChild(
      label
    );
  }


  /*
   * 日付
   */
  if (notice.date) {

    content.appendChild(
      createTextElement(
        "div",
        "notice-date",
        notice.date
      )
    );
  }


  /*
   * タイトル
   */
  if (notice.title) {

    content.appendChild(
      createTextElement(
        "div",
        "notice-title",
        notice.title
      )
    );
  }


  /*
   * 本文
   */
  if (notice.body) {

    content.appendChild(
      createTextElement(
        "div",
        "notice-body",
        notice.body
      )
    );
  }


  /*
   * リンクボタン
   */
  if (
    notice.linkUrl &&
    isSafeHttpUrl(
      notice.linkUrl
    )
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "notice-link";


    link.href =
      notice.linkUrl;


    link.textContent =
      notice.linkText ||
      "詳しくはこちら";


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    content.appendChild(
      link
    );
  }


  card.appendChild(
    content
  );


  return card;
}


/*
 * 個別案内
 */
function renderPersonalNotices(
  notices
) {

  const section =
    document.getElementById(
      "personalSection"
    );


  const list =
    document.getElementById(
      "personalNoticeList"
    );


  list.replaceChildren();


  if (
    !Array.isArray(notices) ||
    notices.length === 0
  ) {

    section.style.display =
      "none";

    return;
  }


  notices.forEach(
    function(notice) {

      list.appendChild(
        createNoticeCard(
          notice,
          true
        )
      );

    }
  );


  section.style.display =
    "block";
}


/*
 * 全体のお知らせ
 */
function renderGeneralNotices(
  notices
) {

  const list =
    document.getElementById(
      "generalNoticeList"
    );


  list.replaceChildren();


  if (
    !Array.isArray(notices) ||
    notices.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty";


    empty.textContent =
      "現在、公開中のお知らせはありません。";


    list.appendChild(
      empty
    );


    return;
  }


  notices.forEach(
    function(notice) {

      list.appendChild(
        createNoticeCard(
          notice,
          false
        )
      );

    }
  );
}


/*
 * 起動
 */
async function start() {

  const loading =
    document.getElementById(
      "loading"
    );


  const errorBox =
    document.getElementById(
      "error"
    );


  const content =
    document.getElementById(
      "content"
    );


  try {

    /*
     * LIFF初期化
     */
    await liff.init({

      liffId:
        LIFF_ID,

      withLoginOnExternalBrowser:
        true

    });


    /*
     * LINE未ログイン
     */
    if (
      !liff.isLoggedIn()
    ) {

      loading.textContent =
        "LINEへログインします…";


      liff.login({
        redirectUri:
          window.location.href
      });


      return;
    }


    /*
     * IDトークン
     */
    currentIdToken =
      liff.getIDToken();


    if (
      !currentIdToken
    ) {

      throw new Error(
        "LINE認証情報を取得できませんでした。"
      );
    }


    loading.textContent =
      "檀信徒登録を確認しています…";


    /*
     * お知らせ取得
     */
    const result =
      await callApi({

        action:
          "notices",

        idToken:
          currentIdToken

      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "お知らせを取得できませんでした。"
      );
    }


    /*
     * 氏名表示
     */
    document
      .getElementById(
        "welcome"
      )
      .textContent =
      result.name +
      " 様";


    /*
     * 個別案内
     */
    renderPersonalNotices(
      result.personalNotices
    );


    /*
     * 全体案内
     */
    renderGeneralNotices(
      result.generalNotices
    );


    loading.style.display =
      "none";


    content.style.display =
      "block";


  } catch (error) {

    console.error(
      error
    );


    loading.style.display =
      "none";


    errorBox.style.display =
      "block";


    errorBox.textContent =
      "お知らせを表示できませんでした。" +
      "（" +
      (
        error.message ||
        "不明なエラー"
      ) +
      "）";
  }
}


start();

</script>

</body>
</html>
