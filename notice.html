<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>お知らせ｜長久寺 檀信徒専用ページ</title>

  <script charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101010;
      color: #eee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 42px 30px 80px;
    }

    .temple-name {
      color: #9b9b9b;
      font-size: 14px;
      letter-spacing: .12em;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
    }

    .line {
      height: 1px;
      background: #383838;
      margin: 32px 0 36px;
    }

    #loading {
      padding: 30px 0;
      color: #aaa;
      font-size: 15px;
      line-height: 1.8;
    }

    #error {
      display: none;
      background: #1b1b1b;
      border: 1px solid #383838;
      border-radius: 14px;
      padding: 25px 20px;
      color: #ef9a9a;
      line-height: 1.8;
      text-align: center;
    }

    #content {
      display: none;
    }

    .welcome {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 28px;
    }

    #noticeList {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .notice-card {
      background: #1b1b1b;
      border: 1px solid #383838;
      border-radius: 14px;
      padding: 22px 20px;
    }

    .notice-date {
      color: #888;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .notice-title {
      color: #eee;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .notice-body {
      color: #bbb;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      background: #1b1b1b;
      border: 1px solid #383838;
      border-radius: 14px;
      padding: 30px 20px;
      color: #999;
      text-align: center;
      line-height: 1.8;
    }

    .back {
      display: inline-block;
      margin-top: 34px;
      color: #bbb;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    @media (max-width: 600px) {
      .page {
        padding:
          34px 20px
          calc(60px + env(safe-area-inset-bottom));
      }

      h1 {
        font-size: 27px;
      }

      .notice-card {
        padding: 20px 18px;
      }
    }
  </style>
</head>

<body>

<main class="page">

  <div class="temple-name">
    曹洞宗 春日山 長久寺
  </div>

  <h1>お知らせ</h1>

  <div class="line"></div>


  <div id="loading">
    お知らせを確認しています…
  </div>


  <div id="error"></div>


  <div id="content">

    <div
      id="welcome"
      class="welcome">
    </div>

    <div id="noticeList"></div>

    <a
      class="back"
      href="./">
      ← 檀信徒専用ページへ戻る
    </a>

  </div>

</main>


<script>

const LIFF_ID =
  "2011649394-wJceQFXt";

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyTU8HcWkrg8glnRa1gL0UknRJEup7yLEIEycTYCSjcts32tzXa3KclmV_scM603bqgoA/exec";


/*
 * GASへPOST
 */
async function callApi(data) {

  const response =
    await fetch(
      GAS_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data),

        redirect:
          "follow"
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return await response.json();
}


/*
 * HTMLとして解釈させず、
 * テキストとして安全に表示する。
 */
function createTextElement(
  tagName,
  className,
  text
) {

  const element =
    document.createElement(
      tagName
    );


  element.className =
    className;


  element.textContent =
    text || "";


  return element;
}


/*
 * お知らせ一覧を描画
 */
function renderNotices(notices) {

  const noticeList =
    document.getElementById(
      "noticeList"
    );


  noticeList.replaceChildren();


  if (
    !Array.isArray(notices) ||
    notices.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty";


    empty.textContent =
      "現在、公開中のお知らせはありません。";


    noticeList.appendChild(
      empty
    );


    return;
  }


  notices.forEach(
    function(notice) {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "notice-card";


      /*
       * 日付
       */
      if (notice.date) {

        card.appendChild(
          createTextElement(
            "div",
            "notice-date",
            notice.date
          )
        );

      }


      /*
       * タイトル
       */
      if (notice.title) {

        card.appendChild(
          createTextElement(
            "div",
            "notice-title",
            notice.title
          )
        );

      }


      /*
       * 本文
       */
      if (notice.body) {

        card.appendChild(
          createTextElement(
            "div",
            "notice-body",
            notice.body
          )
        );

      }


      noticeList.appendChild(
        card
      );

    }
  );

}


/*
 * ページ起動
 */
async function start() {

  const loading =
    document.getElementById(
      "loading"
    );


  const errorBox =
    document.getElementById(
      "error"
    );


  const content =
    document.getElementById(
      "content"
    );


  try {

    /*
     * LIFF初期化
     */
    await liff.init({
      liffId:
        LIFF_ID,

      withLoginOnExternalBrowser:
        true
    });


    /*
     * LINE未ログイン
     */
    if (!liff.isLoggedIn()) {

      loading.textContent =
        "LINEへログインします…";


      liff.login({
        redirectUri:
          window.location.href
      });


      return;
    }


    /*
     * IDトークン取得
     */
    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "LINE認証情報を取得できませんでした。"
      );

    }


    loading.textContent =
      "檀信徒登録を確認しています…";


    /*
     * GASに
     * 「お知らせを取得」
     * と依頼する。
     *
     * GAS側でLINE認証と
     * 檀家マスターの有効状態も確認する。
     */
    const result =
      await callApi({

        action:
          "notices",

        idToken:
          idToken

      });


    if (!result.success) {

      throw new Error(
        result.message ||
        "お知らせを取得できませんでした。"
      );

    }


    /*
     * 認証済み檀家名
     */
    document
      .getElementById(
        "welcome"
      )
      .textContent =
      result.name +
      " 様";


    /*
     * お知らせ表示
     */
    renderNotices(
      result.notices
    );


    loading.style.display =
      "none";


    content.style.display =
      "block";


  } catch (error) {

    console.error(error);


    loading.style.display =
      "none";


    errorBox.style.display =
      "block";


    errorBox.textContent =
      "お知らせを表示できませんでした。" +
      "（" +
      (error.message || "") +
      "）";

  }

}


start();

</script>

</body>
</html>
